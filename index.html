<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>選擇組別顯示圖片</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(to right, #f0f2f5, #dbe9ff);
      margin: 0;
      padding: 30px;
      text-align: center;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    select {
      padding: 10px 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    select:hover {
      border-color: #888;
    }

    #images-container {
      margin-top: 30px;
    }

    .group-images {
      animation: fadeIn 0.5s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 50px;
      padding: 20px;
      border-radius: 10px;
      background-color: #f7f7f7;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .hidden {
      display: none !important;
    }

    .group-images h3 {
      margin-bottom: 15px;
      color: #333;
      font-size: 24px;
      font-weight: 700;
    }

    .image-pair {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 15px 0;
    }

    .image-pair img {
      max-width: 45%;
      margin: 10px 0;
      display: block;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .image-pair img:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .image-pair img.pair2, .image-pair img.pair3, .image-pair img.pair4 {
      max-width: 40%;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 768px) {
      select {
        width: 100%;
        max-width: 300px;
      }

      .image-pair img {
        max-width: 80%;
      }
    }
  </style>
</head>
<body>
  <h2>請選擇組別：</h2>

  <select id="groupSelector">
    <option value="">-- 請選擇 --</option>
    <option value="group1">第一組</option>
    <option value="group2">第二組</option>
    <option value="group3">第三組</option>
  </select>

  <div id="images-container">
    <!-- 第一組圖片 -->
    <div class="group-images hidden" id="group1">
      <h3>第一組</h3>
      <div class="image-pair">
        <img src="assets/images/group1-1.jpg" alt="一組圖1">
        <img src="assets/images/pair1.jpg" alt="配對圖1">
      </div>
      <div class="image-pair">
        <img src="assets/images/group1-2.jpg" alt="一組圖2">
        <img src="assets/images/pair2.jpg" alt="配對圖2" class="pair2">
      </div>
      <div class="image-pair">
        <img src="assets/images/group1-3.jpg" alt="一組圖3">
        <img src="assets/images/pair3.jpg" alt="配對圖3" class="pair3">
      </div>
      <div class="image-pair">
        <img src="assets/images/group1-4.jpg" alt="一組圖4">
        <img src="assets/images/pair4.jpg" alt="配對圖4" class="pair4">
      </div>
    </div>

    <!-- 第二組圖片 -->
    <div class="group-images hidden" id="group2">
      <h3>第二組</h3>
      <div class="image-pair">
        <img src="assets/images/group2-1.jpg" alt="二組圖1">
        <img src="assets/images/pair1.jpg" alt="配對圖1">
      </div>
      <div class="image-pair">
        <img src="assets/images/group2-2.jpg" alt="二組圖2">
        <img src="assets/images/pair2.jpg" alt="配對圖2" class="pair2">
      </div>
      <div class="image-pair">
        <img src="assets/images/group2-3.jpg" alt="二組圖3">
        <img src="assets/images/pair3.jpg" alt="配對圖3" class="pair3">
      </div>
      <div class="image-pair">
        <img src="assets/images/group2-4.jpg" alt="二組圖4">
        <img src="assets/images/pair4.jpg" alt="配對圖4" class="pair4">
      </div>
    </div>

    <!-- 第三組圖片 -->
    <div class="group-images hidden" id="group3">
      <h3>第三組</h3>
      <div class="image-pair">
        <img src="assets/images/group3-1.jpg" alt="三組圖1">
        <img src="assets/images/pair1.jpg" alt="配對圖1">
      </div>
      <div class="image-pair">
        <img src="assets/images/group3-2.jpg" alt="三組圖2">
        <img src="assets/images/pair2.jpg" alt="配對圖2" class="pair2">
      </div>
      <div class="image-pair">
        <img src="assets/images/group3-3.jpg" alt="三組圖3">
        <img src="assets/images/pair3.jpg" alt="配對圖3" class="pair3">
      </div>
      <div class="image-pair">
        <img src="assets/images/group3-4.jpg" alt="三組圖4">
        <img src="assets/images/pair4.jpg" alt="配對圖4" class="pair4">
      </div>
    </div>
  </div>

  <script>
    const selector = document.getElementById('groupSelector');
    const groups = document.querySelectorAll('.group-images');

    selector.addEventListener('change', function () {
      groups.forEach(group => group.classList.add('hidden'));
      const selected = selector.value;
      if (selected) {
        document.getElementById(selected).classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
